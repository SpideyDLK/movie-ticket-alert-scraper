name: Movie Ticket Opening Scraper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-ticket-opening-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          BACK_END_URL: ${{ secrets.BACK_END_URL }}
          BACK_END_API_KEY: ${{ secrets.BACK_END_API_KEY }}
          SCOPE_NEXT_ACTION: ${{ secrets.SCOPE_NEXT_ACTION }}
        run: python main.py
